<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RT 06 / RW 28 Sakura, Grand Cikarang City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF8F9; --surface:#FFFFFF; --sunk:#F4EEF0; --ink:#16302A; --ink-2:#55665E; --ink-3:#8A968F;
  --line:#EADFE3; --sakura:#EBA9BC; --sakura-soft:#FCEEF2; --sakura-ink:#A9416A;
  --leaf:#2F7650; --leaf-soft:#E2F0E7; --amber:#9A6412; --amber-soft:#FBF0DA; --red:#A83434; --red-soft:#FBE7E7;
  --shadow:0 1px 0 rgba(22,48,42,.04), 0 8px 24px -12px rgba(22,48,42,.18);
  --r-s:8px; --r-m:14px; --r-l:22px;
  --font:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1814; --surface:#16211C; --sunk:#1C2A23; --ink:#ECE5E8; --ink-2:#A9B6AF; --ink-3:#77857E;
  --line:#26362E; --sakura:#E79BB2; --sakura-soft:#33212A; --sakura-ink:#F2B6C9;
  --leaf:#7BC79C; --leaf-soft:#1C3527; --amber:#E8B45E; --amber-soft:#33291A; --red:#F08C8C; --red-soft:#3A2020;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#0F1814; --surface:#16211C; --sunk:#1C2A23; --ink:#ECE5E8; --ink-2:#A9B6AF; --ink-3:#77857E;
  --line:#26362E; --sakura:#E79BB2; --sakura-soft:#33212A; --sakura-ink:#F2B6C9;
  --leaf:#7BC79C; --leaf-soft:#1C3527; --amber:#E8B45E; --amber-soft:#33291A; --red:#F08C8C; --red-soft:#3A2020;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;font-feature-settings:"tnum" 1}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sakura-ink);outline-offset:2px;border-radius:6px}
h1,h2,h3{line-height:1.2;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,5vw,40px);font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-weight:800;font-size:15px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--ink-2)}
.mark{width:34px;height:34px;flex:none}
@media (max-width:759px){.seg-label{display:none}#theme{order:2}.seg{order:3;width:100%}.seg button{flex:1;padding:7px 8px}}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg-label{font-size:12px;color:var(--ink-3)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:999px;display:grid;place-items:center;cursor:pointer}
.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0}
.rail{display:none}
main{padding:18px 16px 110px;min-width:0}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav-in{display:flex;justify-content:space-around;max-width:640px;margin:0 auto}
.navbtn{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer}
.navbtn svg{width:22px;height:22px}
.navbtn[aria-current="page"]{color:var(--sakura-ink)}
@media (min-width:900px){
  .layout{grid-template-columns:220px 1fr;gap:28px;padding:0 16px}
  .rail{display:block;position:sticky;top:76px;align-self:start;padding-top:22px}
  .rail .navbtn{flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;padding:10px 12px;border-radius:12px;width:100%}
  .rail .navbtn[aria-current="page"]{background:var(--sakura-soft)}
  .bottomnav{display:none}
  main{padding:22px 0 60px}
}
.demo-note{max-width:1180px;margin:0 auto;padding:6px 16px;font-size:12px;color:var(--amber);background:var(--amber-soft)}
.demo-note-wrap{background:var(--amber-soft)}

/* blocks */
.stack{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--sakura-soft);color:var(--sakura-ink)}
.btn.leaf{background:var(--leaf);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)} .pill.warn{background:var(--amber-soft);color:var(--amber)} .pill.bad{background:var(--red-soft);color:var(--red)} .pill.sak{background:var(--sakura-soft);color:var(--sakura-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--leaf)} .amt.out{color:var(--sakura-ink)}
.field{display:grid;gap:6px;font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-weight:500;font-size:15px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.form{display:grid;gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0}
.check .dot{width:20px;height:20px;border-radius:999px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.check.ok .dot{background:var(--leaf-soft);color:var(--leaf)} .check.no .dot{background:var(--red-soft);color:var(--red)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--ink-2);background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}

/* hero */
.hero{display:grid;gap:16px;grid-template-columns:1fr;align-items:end}
.hero-photo{position:relative;border-radius:var(--r-l);overflow:hidden;aspect-ratio:16/9;background:var(--sunk)}
.hero-photo img{width:100%;height:100%;object-fit:cover}
.hero-photo figcaption{position:absolute;left:12px;bottom:12px;background:rgba(15,24,20,.72);color:#fff;font-size:12px;padding:5px 10px;border-radius:999px}
.hero-text{display:grid;gap:12px}
.hero-text h1 .soft{color:var(--sakura-ink)}
@media (min-width:760px){.hero{grid-template-columns:1.05fr 1fr;gap:28px}}

/* petals */
.gangrow{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.gangrow:first-of-type{border-top:0}
.petals{display:flex;flex-wrap:wrap;gap:3px}
.petal{width:11px;height:11px;border-radius:80% 0 80% 0;background:var(--sunk);border:1px solid var(--line);transform:rotate(-12deg)}
.petal.on{background:var(--sakura);border-color:var(--sakura)}
.petal.held{background:var(--sakura-soft);border-color:var(--sakura)}
@media (prefers-reduced-motion:no-preference){.petal.on{animation:bloom .5s ease both;animation-delay:calc(var(--i)*12ms)}}
@keyframes bloom{from{transform:rotate(-60deg) scale(.3);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}

/* pos dana */
.pos{display:grid;gap:4px;padding:16px;border-radius:var(--r-m);background:var(--sunk)}
.pos .big{font-size:24px;font-weight:800;letter-spacing:-.02em}
.pos.main{background:var(--ink);color:var(--paper)}
.pos.main .muted{color:color-mix(in srgb,var(--paper) 70%,transparent)}

/* house tiles */
.blok{margin-top:16px}
.blok h3{font-size:14px;margin-bottom:8px;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 9px;text-align:left;cursor:pointer;min-height:70px;display:flex;flex-direction:column;gap:2px;position:relative}
.tile .no{font-weight:800;font-size:17px;letter-spacing:-.02em}
.tile .nm{font-size:11px;color:var(--ink-2);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .st{position:absolute;top:7px;right:8px;width:18px;height:18px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:800}
.tile.held{border-color:var(--sakura);background:var(--sakura-soft)}
.tile.held .st{background:var(--sakura-ink);color:#fff}
.tile.done{border-color:color-mix(in srgb,var(--leaf) 50%,transparent);background:var(--leaf-soft);cursor:default}
.tile.done .st{background:var(--leaf);color:#fff}
.tile.kosong{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px);cursor:default;opacity:.75}
.tile.bebas{border-style:dashed;cursor:default}
.tile.locked{cursor:default}
.sticky-bar{position:sticky;bottom:76px;margin-top:18px;background:var(--ink);color:var(--paper);border-radius:var(--r-l);padding:12px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between;box-shadow:var(--shadow)}
.sticky-bar .btn{background:var(--sakura);color:#2a1019}
@media (min-width:900px){.sticky-bar{bottom:16px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1.5px solid var(--line)}

/* months */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.m{border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;font-weight:700;background:var(--sunk);color:var(--ink-3)}
.m b{display:block;font-size:13px}
.m.ok{background:var(--leaf-soft);color:var(--leaf)} .m.held{background:var(--sakura-soft);color:var(--sakura-ink)} .m.no{background:var(--red-soft);color:var(--red)} .m.open{background:var(--amber-soft);color:var(--amber)}

/* gallery */
.albums{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.album{border:0;padding:0;background:none;text-align:left;cursor:pointer;display:grid;gap:8px}
.album .cov{aspect-ratio:4/3;border-radius:var(--r-m);overflow:hidden;background:var(--sunk);position:relative}
.album .cov img{width:100%;height:100%;object-fit:cover}
.album .cnt{position:absolute;right:8px;bottom:8px;background:rgba(15,24,20,.7);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.photos{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.photos button{border:0;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:1;cursor:zoom-in;background:var(--sunk)}
.photos img{width:100%;height:100%;object-fit:cover}

/* aturan */
.pasal{padding:14px 0;border-top:1px solid var(--line)}
.pasal:first-child{border-top:0}
.pasal ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
mark{background:var(--sakura-soft);color:var(--sakura-ink);border-radius:4px;padding:0 2px}

/* people */
.people{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.person{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.av{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;font-weight:800;background:var(--sakura-soft);color:var(--sakura-ink);flex:none}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--font)}

/* modal + toast */
dialog{border:0;border-radius:var(--r-l);padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(15,24,20,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-b{padding:18px;max-height:72vh;overflow:auto}
dialog.photo{width:min(900px,calc(100vw - 24px));background:#000}
dialog.photo img{width:100%;max-height:80vh;object-fit:contain}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line);border-radius:var(--r-m)}
.lock{color:var(--ink-3);font-size:12px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--sunk);color:var(--ink-2)}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.preview{display:flex;gap:6px;flex-wrap:wrap}
.preview img{width:64px;height:64px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <g transform="translate(20 20)">
          <g fill="var(--sakura)">
            <ellipse rx="6" ry="10" cy="-9"/><ellipse rx="6" ry="10" cy="-9" transform="rotate(72)"/><ellipse rx="6" ry="10" cy="-9" transform="rotate(144)"/><ellipse rx="6" ry="10" cy="-9" transform="rotate(216)"/><ellipse rx="6" ry="10" cy="-9" transform="rotate(288)"/>
          </g>
          <circle r="4" fill="var(--ink)"/>
        </g>
      </svg>
      <div><b>RT 06 / RW 28 Sakura</b><span>Grand Cikarang City</span></div>
    </div>
    <span class="seg-label">Lihat sebagai</span>
    <div class="seg" role="group" aria-label="Pilih peran" id="roles"></div>
    <button class="iconbtn" id="theme" aria-label="Ganti tema terang/gelap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<div class="demo-note-wrap"><div class="demo-note">Mockup. Data rumah & warga asli dari data RT, angka iuran dan pengeluaran adalah simulasi untuk demo. Klik-klik saja, semua peran saling terhubung.</div></div>
<div class="layout">
  <nav class="rail" id="rail" aria-label="Menu"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="bottomnav" aria-label="Menu"><div class="bottomnav-in" id="bnav"></div></nav>
<dialog id="dlg"><div class="dlg-h"><h2 id="dlgT"></h2><button class="iconbtn" data-act="close" aria-label="Tutup">✕</button></div><div class="dlg-b" id="dlgB"></div></dialog>
<dialog id="pdlg" class="photo"><img id="pimg" alt=""><div style="padding:10px 14px;color:#fff;display:flex;justify-content:space-between;align-items:center"><span id="pcap"></span><button class="btn sm ghost" style="color:#fff;border-color:#555" data-act="pclose">Tutup</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function tglID(d){ const [y,m,dd]=d.split('-'); return `${+dd} ${BULAN[+m-1]} ${y}`; }
function chart(){
  const ms = MONTHS;
  const data = ms.map(m=>{ const xs=mutasi.filter(x=>x.tgl.startsWith(m)&&x.pos==='kas'&&x.kat!=='Transfer'); return {m, in:xs.filter(x=>x.tipe==='masuk').reduce((a,x)=>a+x.nominal,0), out:xs.filter(x=>x.tipe==='keluar').reduce((a,x)=>a+x.nominal,0)}; });
  const max = Math.max(...data.map(d=>Math.max(d.in,d.out)),1);
  const W=640,H=200,pad=28,bw=(W-pad*2)/ms.length;
  let bars='';
  data.forEach((d,i)=>{ const x=pad+i*bw; const hi=(d.in/max)*(H-50), ho=(d.out/max)*(H-50);
    bars+=`<rect x="${x+bw*.18}" y="${H-24-hi}" width="${bw*.3}" height="${hi}" rx="4" fill="var(--leaf)"><title>Masuk ${fmt(d.in)}</title></rect>
    <rect x="${x+bw*.52}" y="${H-24-ho}" width="${bw*.3}" height="${ho}" rx="4" fill="var(--sakura)"><title>Keluar ${fmt(d.out)}</title></rect>
    <text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${mShort(d.m)}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik pemasukan dan pengeluaran kas RT per bulan"><line x1="${pad}" x2="${W-pad}" y1="${H-24}" y2="${H-24}" stroke="var(--line)"/>${bars}</svg>
  <div class="legend"><span><i style="background:var(--leaf);border-color:var(--leaf)"></i>Pemasukan iuran</span><span><i style="background:var(--sakura);border-color:var(--sakura)"></i>Pengeluaran</span></div></div>`;
}
function mutasiList(opts={}){
  const {pos='semua', limit=999, publik=false, nota=false, admin=false} = opts;
  let xs = mutasi.filter(x=>pos==='semua'||x.pos===pos).sort((a,b)=>b.tgl.localeCompare(a.tgl)||b.id-a.id).slice(0,limit);
  if(!xs.length) return `<div class="empty">Belum ada mutasi.</div>`;
  return `<div class="list">${xs.map(x=>{
    const lock = closed.has(x.tgl.slice(0,7));
    const posL = {kas:'Kas RT',dansos:'Dana sosial',rukem:'Rukem'}[x.pos];
    const notaBtn = x.nota ? (nota ? `<button class="btn sm ghost" data-act="nota" data-id="${x.id}">Lihat nota</button>` : (publik?`<span class="pill">Nota untuk warga</span>`:'')) : '';
    return `<div class="li"><div class="grow"><div style="font-weight:600">${esc(x.ket)}</div>
      <div class="tiny faint">${tglID(x.tgl)}, ${posL}, ${esc(x.kat)} ${lock?'<span class="lock">🔒 bulan sudah ditutup</span>':''}</div></div>
      ${notaBtn}<span class="amt ${x.tipe==='masuk'?'in':'out'} num">${x.tipe==='masuk'?'+':'−'}${fmt(x.nominal)}</span></div>`; }).join('')}</div>`;
}

  ${bloks.map(b=>`<div class="blok"><h3>Blok ${b}</h3><div class="tiles">${rs.filter(r=>r.blok===b).sort((x,y)=>x.no.localeCompare(y.no,undefined,{numeric:true})).map(r=>{
    const s=statusOf(r.a,m); let cls='', mark='';
    if(r.s==='kosong'){cls='kosong';}

    const sub = r.s==='kosong'?'Kosong':(r.bebas?'Bebas: '+r.bebas:(r.n||'Penghuni belum diisi'));
    return `<button class="tile ${cls}" data-tile="${r.a}" aria-label="${r.a} ${esc(sub)}"><span class="no">${r.no}</span><span class="nm">${esc(sub)}</span>${mark?`<span class="st">${mark}</span>`:''}</button>`;}).join('')}</div></div>`).join('')}

};

const FORMS = {
  dansos:['Ajukan dana sosial', dansosForm],
  surat:['Surat pengantar', ()=>`<div class="form"><label class="field">Keperluan<select><option>Domisili</option><option>Pengantar SKCK</option><option>Pengantar nikah</option><option>Keterangan usaha</option></select></label><label class="field">Untuk anggota keluarga<select><option>Kepala keluarga</option><option>Istri</option><option>Anak</option></select></label><label class="field">Catatan<textarea placeholder="Opsional"></textarea></label><p class="small muted">Setelah disetujui ketua RT, surat PDF bernomor otomatis terkirim ke WhatsApp Anda.</p><button class="btn" data-act="kirim" data-j="Surat pengantar">Kirim pengajuan</button></div>`],
  tamu:['Lapor tamu menginap', ()=>`<div class="form"><label class="field">Nama tamu<input placeholder="Nama lengkap"></label><label class="field">Hubungan<select><option>Keluarga</option><option>Kerabat</option><option>Teman</option><option>ART / babysitter</option></select></label><div class="grid2"><label class="field">Datang<input type="date" value="${TODAY}"></label><label class="field">Pulang<input type="date"></label></div><label class="field">Foto KTP tamu<input type="file" accept="image/*"></label><button class="btn" data-act="kirim" data-j="Lapor tamu">Laporkan</button></div>`],
  hajatan:['Izin hajatan', ()=>`<div class="form"><label class="field">Acara<input placeholder="Contoh: Syukuran khitanan"></label><label class="field">Tanggal (minimal H-3)<input type="date" min="2026-10-04"></label><label class="check" style="font-weight:500"><input type="checkbox"> Perlu menutup jalan</label><p class="small" style="font-weight:600">Pinjam inventaris RT</p>${['Panggung RT (1 set, gudang RT)','Sound system Politron + 2 mic wireless','Terpal biru oranye 8 m','Gerobak'].map(x=>`<label class="check" style="font-weight:500;padding:2px 0"><input type="checkbox"> ${x}</label>`).join('')}<button class="btn" data-act="kirim" data-j="Izin hajatan">Ajukan izin</button></div>`],
  aduan:['Laporan lingkungan', ()=>`<div class="form"><label class="field">Kategori<select><option>Lampu jalan mati</option><option>Sampah</option><option>Selokan mampet</option><option>Keamanan</option><option>Lainnya</option></select></label><label class="field">Lokasi<input placeholder="Contoh: depan G20/14"></label><label class="field">Foto<input type="file" accept="image/*"></label><label class="field">Keterangan<textarea></textarea></label><button class="btn" data-act="kirim" data-j="Laporan lingkungan">Kirim laporan</button></div>`],
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if(d.role){ S.role=d.role; S.view=NAV[d.role][0][0]; S.album=null; return go(); }
  if(d.view){ S.view=d.view; S.album=null; return go(); }
  if(d.goto){ if(!NAV[S.role].some(n=>n[0]===d.goto) && !VIEWS[d.goto]) return; S.view=d.goto; S.album=null; return go(); }
  if(d.pubm){ S.pubBulan=d.pubm; return go(); }
  if(d.album){ S.album=d.album; return go(); }
  if(d.photo){ document.getElementById('pimg').src=d.src; document.getElementById('pimg').alt=d.photo; document.getElementById('pcap').textContent=d.photo; return document.getElementById('pdlg').showModal(); }
  if(d.rf){ S.rumahF=d.rf; return go(); }
  if(d.form){ const [ti,fn]=FORMS[d.form]; return modal(ti, fn()); }
  if(d.tile){
    const r=rumah.find(x=>x.a===d.tile), m=S.tarikBulan, k=r.a+'|'+m, s=statusOf(r.a,m);
    if(closed.has(m)) return toast('Bulan ini sudah ditutup buku');
    if(r.s==='kosong') return toast(r.a+' tercatat kosong, tidak wajib iuran');
    if(r.bebas) return toast(r.a+' bebas iuran: '+r.bebas);
    if(s==='diterima') return toast('Sudah diterima bendahara, tidak bisa dibatalkan di sini');
    if(s==='disetor') return toast('Sudah disetor, menunggu konfirmasi bendahara');
    if(s==='dipegang'){ delete pay[k]; toast(r.a+' dibatalkan'); } else { pay[k]={st:'dipegang'}; toast(r.a+' lunas '+mLabel(m)+', Rp25.000 dicatat'); }
    return go();
  }
  if(d.setor){
    const m=d.setor, g=S.gang, rs=rumah.filter(r=>r.g===g&&statusOf(r.a,m)==='dipegang');
    rs.forEach(r=>pay[r.a+'|'+m].st='disetor');
    setoran.push({id:'S'+m+g+Date.now(), gang:g, bulan:m, n:rs.length, nominal:rs.length*IURAN, st:'menunggu', tgl:TODAY});
    toast(`Setoran ${fmt(rs.length*IURAN)} dikirim, bendahara mendapat notifikasi`); return go();
  }
  if(d.terima){
    const s=setoran.find(x=>x.id===d.terima); s.st='diterima';
    rumah.filter(r=>r.g===s.gang&&statusOf(r.a,s.bulan)==='disetor').forEach(r=>pay[r.a+'|'+s.bulan].st='diterima');
    mutasi.push({id:mid++, tgl:TODAY, pos:'kas', tipe:'masuk', ket:`Setoran iuran gang ${s.gang}, ${mLabel(s.bulan)}`, nominal:s.nominal, kat:'Iuran', nota:false});
    toast('Setoran diterima, saldo kas bertambah '+fmt(s.nominal)); return go();
  }
  if(d.tutup){ closed.add(d.tutup); toast(`Buku ${mLabel(d.tutup)} ditutup, laporan PDF dikirim ke grup`); return go(); }
  switch(d.act){
    case 'close': return closeModal();
    case 'pclose': return document.getElementById('pdlg').close();
    case 'albums': S.album=null; return go();
    case 'share': return toast('Tautan album disalin, siap ditempel di WhatsApp');
    case 'lapor': return toast('Di versi final tombol ini membuka WhatsApp ketua RT');
    case 'copylink': return toast('Tautan pasal '+d.id+' disalin');
    case 'bayar': return modal('Bayar iuran', `<div class="form"><div class="pos"><span class="small muted">Tagihan</span><span class="big num">${fmt(IURAN*MONTHS.filter(m=>!statusOf(S.demoRumah,m)).length)}</span><span class="tiny faint">${MONTHS.filter(m=>!statusOf(S.demoRumah,m)).map(mLabel).join(', ')}</span></div><div class="grid2"><div class="card flat"><h3>Tunai</h3><p class="small muted">Serahkan ke koordinator gang ${rumah.find(r=>r.a===S.demoRumah).g}, ${KOORD[rumah.find(r=>r.a===S.demoRumah).g]}. Status berubah saat beliau mencatat.</p></div><div class="card flat"><h3>Transfer / QRIS</h3><p class="small muted">Rekening atau QRIS RT diisi bendahara. Setelah transfer, unggah bukti.</p><input type="file" accept="image/*" style="margin-top:8px"></div></div><button class="btn" data-act="kirim" data-j="Bukti bayar iuran">Kirim bukti transfer</button></div>`);
    case 'kirimDansos': { const sel=document.getElementById('dj'); pengajuan.unshift({jenis:'Dana sosial', ket:sel.options[sel.selectedIndex].text+', '+fmt(+sel.value), st:'Menunggu pengurus'}); closeModal(); toast('Pengajuan dana sosial terkirim'); S.view='rumahku'; return go(); }
    case 'kirim': pengajuan.unshift({jenis:d.j, ket:'Dikirim '+tglID(TODAY), st:'Menunggu pengurus'}); closeModal(); toast(d.j+' terkirim ke pengurus'); if(S.role==='warga'){S.view='rumahku'; go();} return;
    case 'nota': { const x=mutasi.find(m=>m.id==d.id); return modal('Nota', `<div class="stack"><svg viewBox="0 0 300 380" style="width:100%;max-width:300px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid var(--line)"><text x="24" y="40" font-size="16" font-weight="700" fill="#333">NOTA</text>${[70,95,120,145,170,195].map((y,i)=>`<rect x="24" y="${y}" width="${150+((i*37)%90)}" height="8" rx="4" fill="#ddd"/><rect x="230" y="${y}" width="46" height="8" rx="4" fill="#ddd"/>`).join('')}<line x1="24" x2="276" y1="230" y2="230" stroke="#ccc"/><text x="24" y="260" font-size="14" fill="#333">Total</text><text x="276" y="260" font-size="14" font-weight="700" fill="#333" text-anchor="end">${fmt(x.nominal)}</text><text x="150" y="340" font-size="11" fill="#999" text-anchor="middle">contoh foto nota</text></svg><div><b>${esc(x.ket)}</b><p class="small muted">${tglID(x.tgl)}, dicatat bendahara</p></div></div>`); }
    case 'addKeluar': return modal('Catat pengeluaran', `<div class="form"><label class="field">Dari pos<select id="kp"><option value="kas">Kas RT</option><option value="dansos">Dana sosial</option><option value="rukem">Rukun kematian</option></select></label><label class="field">Untuk apa<input id="kk" placeholder="Contoh: Beli lampu jalan"></label><div class="grid2"><label class="field">Nominal<input id="kn" inputmode="numeric" placeholder="150000"></label><label class="field">Tanggal<input id="kt" type="date" value="${TODAY}"></label></div><label class="field">Kategori<select id="kc"><option>Fasilitas</option><option>Kebersihan</option><option>Kegiatan</option><option>Kesehatan</option><option>Administrasi</option><option>Dana sosial</option></select></label><label class="field">Foto nota (wajib)<input id="kf" type="file" accept="image/*" capture="environment"></label><button class="btn" data-act="saveKeluar">Simpan pengeluaran</button></div>`);
    case 'saveKeluar': {
      const n=+String(document.getElementById('kn').value).replace(/\D/g,''), k=document.getElementById('kk').value.trim(), tg=document.getElementById('kt').value, f=document.getElementById('kf').files.length;
      if(!k||!n) return toast('Isi keperluan dan nominal');
      if(!f) return toast('Foto nota wajib dilampirkan');
      if(closed.has(tg.slice(0,7))) return toast('Bulan itu sudah ditutup. Catat sebagai koreksi di bulan berjalan');
      mutasi.push({id:mid++, tgl:tg, pos:document.getElementById('kp').value, tipe:'keluar', ket:k, kat:document.getElementById('kc').value, nominal:n, nota:true});
      closeModal(); toast('Pengeluaran '+fmt(n)+' tersimpan'); return go(); }
    case 'ingatkan': return toast('Pengingat pribadi terkirim ke WhatsApp penghuni '+d.a);
    case 'import': return toast('Impor CSV: data dicocokkan per alamat, baris bermasalah ditampilkan sebelum disimpan');
    case 'publish': {
      const j=document.getElementById('pj').value.trim(); const fs=[...document.getElementById('pf').files];
      if(!j) return toast('Isi judul kegiatan'); if(!fs.length) return toast('Pilih minimal satu foto');
      const urls=fs.map(f=>URL.createObjectURL(f)); const tg=document.getElementById('pt').value, aid=document.getElementById('pa').value;
      if(aid==='baru') albums.unshift({id:'a'+Date.now(), judul:j, tgl:tg, ket:document.getElementById('pk').value||'', foto:urls.map(u=>[u,j])});
      else albums.find(a=>a.id===aid).foto.unshift(...urls.map(u=>[u,j]));
      toast('Kegiatan terbit'+(document.getElementById('pw').checked?' dan diumumkan ke grup':'')); S.role='publik'; S.view='kegiatan'; S.album=null; return go(); }
  }
});
document.addEventListener('input', e => {
  if(e.target.id==='q'){ S.q=e.target.value; const pos=e.target.selectionStart; go(); const el=document.getElementById('q'); el.focus(); el.setSelectionRange(pos,pos); }
  if(e.target.id==='rq'){ S.rumahQ=e.target.value; const pos=e.target.selectionStart; go(); const el=document.getElementById('rq'); el.focus(); el.setSelectionRange(pos,pos); }
});
document.addEventListener('change', e => {
  if(e.target.id==='selGang'){ S.gang=+e.target.value; go(); }
  if(e.target.id==='selBulan'){ S.tarikBulan=e.target.value; go(); }
  if(e.target.id==='dj'){ document.getElementById('dn').textContent=fmt(+e.target.value); }
  if(e.target.id==='pf'){ document.getElementById('pprev').innerHTML=[...e.target.files].map(f=>`<img src="${URL.createObjectURL(f)}" alt="">`).join(''); }
});
document.getElementById('theme').addEventListener('click',()=>{
  const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark?'light':'dark'; try{localStorage.setItem('rt-theme',r.dataset.theme)}catch(_){}
});
try{ const t=localStorage.getItem('rt-theme'); if(t) document.documentElement.dataset.theme=t; }catch(_){}
go();
</script>
</body>
</html>
